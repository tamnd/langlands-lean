    The module prefix is Langlands.Ported.NYLL in place of Nyll. The files are the import closure of the files of Theorems/LocalClassFieldTheory, but not All.lean, and of Theorems/GlobalClassFieldTheory/All.lean and Theorems/KroneckerWeber.lean. The source pin and the project pin are both Lean and Mathlib v4.36.0, so apart from the module prefix and the file header the files are those of the source.
