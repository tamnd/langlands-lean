  into: Langlands/Ported/NYLL
  changes: >-
    The module prefix is Langlands.Ported.NYLL in place of Nyll. The files are the import closure of the files of Theorems/LocalClassFieldTheory, but not All.lean. The source pin is Lean v4.36.0, and the project pin is v4.35.0, so these Mathlib names are changed.
    Group.Abelianization is Abelianization, and Group.abelianizationCongr is abelianizationCongr.
    Group.Abelianization.commutator_le_ker is Abelianization.commutator_subset_ker.
    SubsemiringClass.charP_iff is CharP.subsemiring.
    Polynomial.X_pow_sub_X_ne_zero is FiniteField.X_pow_card_sub_X_ne_zero.
    isLocalHom_of_le_jacobson_bot takes the Jacobson radical of the zero ideal, so two proofs use IsLocalRing.jacobson_eq_maximalIdeal, and Core.lean imports Mathlib.RingTheory.Henselian.
    HenselianRing.jac has the Jacobson radical of the zero ideal, so two proofs do not rewrite with Ideal.jacobson_bot, and one proof uses IsLocalRing.jacobson_eq_maximalIdeal.
    Submodule.eq_bot_of_le_smul_of_le_jacobson_bot takes the module as an argument.
    The pow_apply lemma of a group representation is Module.End.pow_apply, and one_apply_eq_self is Module.End.one_apply.
    IsLocalRing.local_hom_tfae is IsLocalRing.local_hom_TFAE.
    Sylow.isPGroup is Sylow.isPGroup'.
    Group.abelianizationCongr_of is abelianizationCongr_of, and IntermediateField.le_fixedField_iff_le_fixingSubgroup is IntermediateField.le_iff_le.
    Submodule.le_of_le_smul_of_le_jacobson is Submodule.le_of_le_smul_of_le_jacobson_bot, so one proof uses IsLocalRing.jacobson_eq_maximalIdeal. The same change applies to isLocalHom_of_le_jacobson in AdicCompletionInverseLimit.lean.
    DiscreteValuationField/Basic.lean adds the instance valuationSubring_charP with CharP.subring.
    Analytic/Arithmetic.lean proves multiplicity_le_nat_log, multiplicity_factorial_le and multiplicity_factorial_lt_of_ne_zero from the padicValNat lemmas, because these names are not in the Mathlib of the project pin.
    Analytic/DenominatorValuation.lean uses pow_succ_padicValNat_not_dvd, and IwasawaPrincipalUnits.lean uses padicValNat.mul and padicValNat.prime_pow in place of the multiplicity lemmas.
    PowerSeries.irreducible_X is PowerSeries.X_irreducible, and PowerSeries.prime_X is PowerSeries.X_prime.
    In CompletedUnramifiedField.lean the named argument of FiniteField.X_pow_card_sub_X_ne_zero is K', and in PrimitiveAction.lean the case of Nat.strong_induction_on is h.
