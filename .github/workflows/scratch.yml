name: scratch

# Temporary: check fourier_mixed_prod variants on v4.36.0 without the full build.
on:
  push:
    branches: [chore/toolchain-v4.36.0]

permissions:
  contents: read

jobs:
  scratch:
    name: scratch build of MixedWeightTheta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build the imports
        run: lake build Langlands.Tate.GlobalLattice
      - name: scratch variants
        run: lake env lean tmpcheck/ScratchMixed.lean
