      status: proved
      note: 'Each admissible pair is isomorphic to the twist of a minimal pair'
    - name: Langlands.LocalGL2.isLevel_twistChar_of_ne
      kind: theorem
      status: proved
      note: 'If the levels of xi and chi_E differ, the twist has the larger level'
    - name: Langlands.LocalGL2.isLevel_comp_normUnits_of_ramified
      kind: theorem
      status: proved
      note: 'For E/F tame and totally ramified, the level of chi composed with the norm is twice the level of chi'
    - name: Langlands.LocalGL2.index_restrictSubgroup
      kind: theorem
      status: proved
      note: 'The Weil group W_L of a finite separable extension L/K has index [L:K] in W_K'
    - name: Langlands.LocalGL2.ind
      kind: definition
      status: proved
      note: 'The representation of dimension 2 induced from a character of a subgroup of index 2'
    - name: Langlands.LocalGL2.isIrreducibleRep_ind_iff
      kind: theorem
      status: proved
      note: 'The induced representation is irreducible if and only if the character is not invariant under conjugation (Mackey)'
    - name: Langlands.LocalGL2.repIso_ind_conjChar
      kind: theorem
      status: proved
      note: 'The representations induced from a character and from its conjugate are isomorphic'
    - name: Langlands.LocalGL2.repIso_ind_mul_restrict
      kind: theorem
      status: proved
      note: 'Induction commutes with the twist by a character of the big group'
    - name: Langlands.LocalGL2.det_ind_eq_signChar_mul_transfer
      kind: theorem
      status: proved
      note: 'The determinant of the induced representation is the sign character times the transfer of the character'
    - name: Langlands.LocalGL2.repIso_ind_of_eigenvector
      kind: theorem
      status: proved
      note: 'Frobenius reciprocity, easy direction: a representation that contains a regular character of H is induced from it'
    - name: Langlands.LocalGL2.indWD
      kind: definition
      status: proved
      note: 'The induced Weil-Deligne representation Ind_{W_L}^{W_K} phi with N = 0'
    - name: Langlands.LocalGL2.isIrreducible_indWD
      kind: theorem
      status: proved
      note: 'The induced Weil-Deligne representation is irreducible when the character is regular'
    - name: Langlands.LocalGL2.iso_indWD_of_eigenvector
      kind: theorem
      status: proved
      note: 'Frobenius reciprocity for the induced Weil-Deligne representation'
    - name: Langlands.LocalGL2.ArtinConjCompat
      kind: statement
      status: known
      note: 'known: the local Artin map of L is compatible with conjugation by W_F (Serre, Local fields, Ch. XI §3)'
    - name: Langlands.LocalGL2.ArtinNormCompat
      kind: statement
      status: known
      note: 'known: the inclusion W_L into W_F corresponds to the norm N_{L/F} (Serre, Local fields, Ch. XI §3)'
    - name: Langlands.LocalGL2.ArtinTransferCompat
      kind: statement
      status: known
      note: 'known: the transfer W_F to W_L^ab corresponds to the inclusion of F^x in L^x (Serre, Local fields, Ch. XI §3)'
    - name: Langlands.LocalGL2.charW
      kind: definition
      status: proved
      note: 'The character xi_W = xi composed with the inverse Artin map of L, as a character of W_L'
    - name: Langlands.LocalGL2.tameParam
      kind: definition
      status: proved
      note: 'The tame parameter sigma(L, xi) = Ind xi_W with N = 0'
    - name: Langlands.LocalGL2.twistWD
      kind: definition
      status: proved
      note: 'The twist of a Weil-Deligne representation by a smooth character of W_F'
    - name: Langlands.LocalGL2.quadChar
      kind: definition
      status: proved
      note: 'The quadratic character kappa_{L/F} = sign composed with the Artin map of F'
    - name: Langlands.LocalGL2.eq_or_eq_conjChar_of_repIso
      kind: theorem
      status: proved
      note: 'For an index 2 subgroup, Ind phi iso Ind phi'' gives phi'' = phi or phi'' = phi^s'
    - name: Langlands.LocalGL2.eq_of_algEquiv
      kind: theorem
      status: proved
      note: 'Two F-isomorphic quadratic subfields of the algebraic closure are equal'
    - name: Langlands.LocalGL2.isSmoothChar_twistChar
      kind: theorem
      status: proved
      note: 'The twist of a smooth character by chi composed with the norm is smooth'
    - name: Langlands.LocalGL2.quadChar_eq_one_iff
      kind: theorem
      status: proved
      note: 'kappa_{L/F}(a) = 1 if and only if a is a norm from L'
    - name: Langlands.LocalGL2.isIrreducible_tameParam
      kind: theorem
      status: proved-mod
      note: 'proved-mod: ArtinConjCompat. sigma(L, xi) is irreducible for an admissible character xi'
    - name: Langlands.LocalGL2.tameParam_iso
      kind: theorem
      status: proved-mod
      note: 'proved-mod: ArtinConjCompat. sigma(L, xi) is constant on the F-conjugacy class of xi'
    - name: Langlands.LocalGL2.tameParam_twist
      kind: theorem
      status: proved-mod
      note: 'proved-mod: ArtinNormCompat. sigma(L, xi tensor chi_L) is the twist of sigma(L, xi) by chi'
    - name: Langlands.LocalGL2.det_tameParam
      kind: theorem
      status: proved-mod
      note: 'proved-mod: ArtinTransferCompat. det sigma(L, xi) corresponds to kappa_{L/F} times xi restricted to F^x'
    - name: Langlands.LocalGL2.exists_algEquiv_of_tameParam_iso
      kind: theorem
      status: proved-mod
      note: 'proved-mod: ArtinConjCompat. sigma(L, xi) iso sigma(L, xi'') gives xi = xi'' composed with an F-automorphism of L'
    - name: Langlands.LocalGL2.ChainOrder
      kind: definition
      status: proved
      note: 'The chain orders of M_2(F): the maximal order (e = 1) and the Iwahori order (e = 2)'
    - name: Langlands.LocalGL2.radPow
      kind: definition
      status: proved
      note: 'The powers P^n of the radical of a chain order, given by entry bounds'
    - name: Langlands.LocalGL2.unitsFilt
      kind: definition
      status: proved
      note: 'The unit filtration U^n of a chain order'
    - name: Langlands.LocalGL2.mem_jacobson_iff
      kind: theorem
      status: proved
      note: 'P^1 is the Jacobson radical of the chain order'
    - name: Langlands.LocalGL2.mem_radPow_add_e_iff
      kind: theorem
      status: proved
      note: 'P^(n+e) = varpi P^n'
    - name: Langlands.LocalGL2.normalizer_eq_closure
      kind: theorem
      status: proved
      note: 'The normalizer of a chain order is generated by Pi and U^0'
    - name: Langlands.LocalGL2.IsAdapted.leftMulMatrix_mem_radPow_iff
      kind: theorem
      status: proved
      note: 'For an adapted basis, P^n meets E in p_E^n'
    - name: Langlands.LocalGL2.IsAdapted.embGL_mem_normalizer
      kind: theorem
      status: proved
      note: 'For an adapted basis, E^x normalizes the chain order'
    - name: Langlands.LocalGL2.isAdapted_ramBasis
      kind: theorem
      status: proved
      note: 'For ramified E, the basis (varpi_E, 1) is adapted to the Iwahori order'
    - name: Langlands.LocalGL2.psiAlpha
      kind: definition
      status: proved
      note: 'The character psi_alpha of U^(n/2+1), g to psi(tr(alpha(g-1)))'
    - name: Langlands.LocalGL2.psiAlpha_congr
      kind: theorem
      status: proved
      note: 'psi_alpha depends only on alpha modulo P^(-n/2)'
    - name: Langlands.LocalGL2.IsSimpleStratum
      kind: definition
      status: proved
      note: 'A simple stratum (A, n, alpha) in M_2(F)'
    - name: Langlands.LocalGL2.IsAdapted.isSimpleStratum
      kind: theorem
      status: proved
      note: 'An element of E of valuation -n not in F gives a simple stratum for an adapted basis'
    - name: Langlands.Bridge.localExistence
      kind: theorem
      status: proved
      note: The local existence theorem LocalExistence. The proof is the port of n-yamaguchi-0729/ClassFieldTheory in Langlands/Ported/NYLL, with the move from the separable closure to the algebraic closure.
    - name: Langlands.WeilGroup.denseRange_toGalois
      kind: theorem
      status: proved
      note: The Weil group is dense in the absolute Galois group. The proof shows that the absolute Galois group is compact in each characteristic and that its map to the Galois group of the residue field is open.
    - name: Langlands.WeilGroup.toGaloisAb_injective
      kind: theorem
      status: proved
      note: The map from the abelianization of the Weil group to the abelianization of the absolute Galois group is injective.
    - name: Langlands.localLanglandsTorusSplit
      kind: theorem
      status: proved
      note: The proof uses only that the local Artin map is an isomorphism of topological groups. With LocalReciprocityGL1 it gives the correspondence for split tori.
    - name: Langlands.Bridge.hasseWeil_rat_of_hasseWeilEllipticQ
      kind: theorem
      status: proved
      note: HasseWeilEllipticQ implies the Hasse-Weil statement over Q of formal-conjectures.
    - name: Langlands.Bridge.not_modularity_conjecture
      kind: theorem
      status: proved
      note: The statement modularity_conjecture of formal-conjectures at commit 9097e2f is false as stated, because it reads the coefficients in the parameter exp(2 pi i tau / N).
    - name: Langlands.Bridge.satoTate_conjecture_of_satoTate
      kind: theorem
      status: proved
      note: SatoTate implies the statement satoTate_conjecture of formal-conjectures, with the hypotheses ApAgree and HasseBound on each curve.
    - name: Langlands.Bridge.ramanujan_petersson_of_ramanujanPeterssonHolomorphic
      kind: theorem
      status: proved
      note: RamanujanPeterssonHolomorphic implies the statement ramanujan_petersson of formal-conjectures, with the hypothesis DeltaIsEigenform.
    - name: Langlands.Fidelity.localExistence_top
      kind: theorem
      status: proved
    - name: Langlands.Fidelity.kroneckerWeber_bot
      kind: theorem
      status: proved
    - name: Langlands.Fidelity.satoTate_total_mass
      kind: theorem
      status: proved
    - name: Langlands.Fidelity.not_hasCMOverQ_X0_11
      kind: theorem
      status: proved
    - name: Langlands.LocalField.isAlgClosed_residueFieldBar
      kind: instance
      status: proved
    - name: Langlands.LocalField.not_isOfFinOrder_frobenius
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.ker_degree
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.degree_surjective
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.continuous_degree
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.isCompact_inertia
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.not_isOpen_inertia_induced
      kind: theorem
      status: proved
    - name: Langlands.Shapiro.shapiro
      kind: def
      status: proved
      note: Shapiro's lemma in degree one for continuous cohomology with a coinduced module and an open subgroup. It is the first step of the local Langlands correspondence for induced tori.
    - name: Langlands.Shapiro.shapiro_top
      kind: theorem
      status: proved
    - name: Langlands.exists_isLocalArtinMap
      kind: theorem
      status: proved
      note: The existence of the local reciprocity map, as the inverse of the injection of the abelianized Weil group into the abelianized Galois group composed with the absolute local Artin map of the port.
    - name: Langlands.isLocalArtinMap_unique
      kind: theorem
      status: proved
      note: The uniqueness of the local reciprocity map, through the uniqueness of coherent families of finite Artin maps in the port.
    - name: Langlands.localReciprocityGL1
      kind: theorem
      status: proved
      note: Local class field theory as the local Langlands correspondence for GL(1).
    - name: Langlands.WeilGroup.isOpen_restrictSubgroup
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.finiteIndex_restrictSubgroup
      kind: instance
      status: proved
    - name: Langlands.WeilGroup.map_degree_restrictSubgroup
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.weilHom_injective
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.continuous_weilHom
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.range_weilHom
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.degree_weilHom
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.t2Space_weilGroup
      kind: instance
      status: proved
    - name: Langlands.WeilGroup.weilHom_mem_inertia_iff
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.weilEquiv
      kind: definition
      status: proved
      note: The Weil group of a finite extension L of K is isomorphic as a topological group to the open subgroup of the Weil group of K that fixes L.
    - name: Langlands.WeilGroup.isEmbedding_weilHom
      kind: theorem
      status: proved
    - name: Langlands.WeilGroup.restrictSubgroup_bot
      kind: theorem
