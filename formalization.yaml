# The metadata of this formalization. The keys follow the formalization.yaml schema of version 0.4 that resolutionorg/hironaka uses.
version: "0.4"
project:
  name: langlands-lean
  description: Statements in Lean 4 of the Langlands program, the proofs of its known parts, and the work on its open parts.
  authors:
    - The langlands authors
  responsible_maintainers:
    - tamnd
  license: Apache-2.0
sources:
  - title: Local class field theory
    authors: [Jean-Pierre Serre]
    id: "langlands:Ser67"
    type: paper
    location: Algebraic Number Theory, edited by J. W. S. Cassels and A. Frohlich, Academic Press (1967), Chapter VI
    relationship: background
    note: The statement of local reciprocity for GL(1) follows Theorem 2 of this chapter, with the geometric normalization.
    author_endorsement: false
  - title: Number theoretic background
    authors: [John Tate]
    id: "langlands:Tat79"
    type: paper
    location: Automorphic forms, representations and L-functions, Proc. Sympos. Pure Math. 33, part 2 (1979)
    relationship: background
    note: The source of the Weil group as a subgroup of the absolute Galois group, and of the normalizations.
    author_endorsement: false
  - title: The local Langlands conjecture for GL(2)
    authors: [Colin J. Bushnell, Guy Henniart]
    id: "langlands:BH06"
    type: book
    location: Grundlehren der mathematischen Wissenschaften 335, Springer (2006)
    relationship: background
    note: The source of the statement of the local Langlands correspondence for GL(2).
    author_endorsement: false
  - title: On the modularity of elliptic curves over Q
    authors: [Christophe Breuil, Brian Conrad, Fred Diamond, Richard Taylor]
    id: "langlands:BCDT01"
    type: paper
    location: Journal of the American Mathematical Society 14 (2001)
    relationship: background
    note: The source of ModularityEllipticQ. Not formalized here yet.
    author_endorsement: false
  - title: Modular elliptic curves and Fermat's last theorem
    authors: [Andrew Wiles]
    id: "langlands:Wil95"
    type: paper
    location: Annals of Mathematics 141 (1995)
    relationship: background
    note: The source of ModularitySemistableQ. Not formalized here yet.
    author_endorsement: false
  - title: La conjecture de Weil. I
    authors: [Pierre Deligne]
    id: "langlands:Del74"
    type: paper
    location: Publications Mathematiques de l'IHES 43 (1974)
    relationship: background
    note: The source of RamanujanPeterssonHolomorphic. Not formalized here yet.
    author_endorsement: false
  - title: A family of Calabi-Yau varieties and potential automorphy II
    authors: [Thomas Barnet-Lamb, David Geraghty, Michael Harris, Richard Taylor]
    id: "langlands:BLGHT11"
    type: paper
    location: Publications of the Research Institute for Mathematical Sciences 47 (2011)
    relationship: background
    note: The source of SatoTate. Not formalized here yet.
    author_endorsement: false
  - title: n-yamaguchi-0729/ClassFieldTheory, commit fc644f42dade5bdc7157fc3ef2eef4dbf2d6a565
    authors: [Naganori Yamaguchi]
    id: "langlands:nyll"
    type: code
    location: https://github.com/n-yamaguchi-0729/ClassFieldTheory
    relationship: copied
    note: The import closure of the theorem finiteAbelianLocalReciprocity is copied to Langlands/Ported/NYLL under the Apache License 2.0, with the changes that manifests/ported.yaml lists.
    author_endorsement: false
  - title: google-deepmind/formal-conjectures, commit 9097e2f90e66d2f6244209cb1c07f7120d17ec53
    authors: [The Formal Conjectures Authors]
    id: "langlands:formal-conjectures"
    type: code
    location: https://github.com/google-deepmind/formal-conjectures
    relationship: copied
    note: The statements of FormalConjectures/Wikipedia/ModularityConjecture.lean, SatoTateConjecture.lean, RamanujanTau.lean and HasseWeil.lean are copied to Langlands/Ported/FormalConjectures/Wikipedia.lean under the Apache License 2.0. The files of Langlands/Bridge/ compare the statements of both projects.
    author_endorsement: false
classification:
  arxiv: [math.NT, math.RT]
  msc2020: [11F70, 11R37, 11S37, 11F80, 11G05, 22E50]
status:
  scope: statements
  sorry_count: 0
  sorry_in_definitions: false
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - name: Langlands.LocalReciprocityGL1
      kind: statement
      status: known
      note: Local class field theory as the local Langlands correspondence for GL(1). This is a definition of a proposition. It is proved by Langlands.localReciprocityGL1.
    - name: Langlands.LocalLanglandsTorusSplit
      kind: statement
      status: known
      note: The local Langlands correspondence for the split torus of rank n, through a local Artin map. It is proved by Langlands.localLanglandsTorusSplit.
    - name: Langlands.LocalLanglandsTorusInduced
      kind: statement
      status: known
      note: The local Langlands correspondence for the induced torus Res_{L/K} G_m, through a local Artin map of L and Shapiro's isomorphism. It is proved by Langlands.localLanglandsTorusInduced.
    - name: Langlands.LocalExistence
      kind: statement
      status: known
    - name: Langlands.GlobalReciprocity
      kind: statement
      status: known
    - name: Langlands.GlobalExistence
      kind: statement
      status: known
    - name: Langlands.KroneckerWeber
      kind: statement
      status: known
    - name: Langlands.HeckeFunctionalEquation
      kind: statement
      status: known
      note: Hecke's theorem as proved in Tate's thesis. The completed L-function of a Hecke character has a meromorphic continuation and a functional equation with a root number of absolute value one. The archimedean parameters are hypotheses.
    - name: Langlands.HeckeFunctionalEquationAt
      kind: statement
      status: known
      note: Hecke's theorem for one number field. HeckeFunctionalEquation is this statement for all number fields.
    - name: Langlands.heckeFunctionalEquationAt_rat
      kind: theorem
      status: proved
      note: Hecke's theorem for the rational numbers. A Hecke character of Q is a primitive Dirichlet character times a power of the idele norm, and the proof uses the functional equation of Dirichlet L-functions in Mathlib.
    - name: Langlands.ArchimedeanParametersExist
      kind: statement
      status: known
      note: Each Hecke character has archimedean parameters at each infinite place. This shows that HeckeFunctionalEquation is not vacuous.
    - name: Langlands.ModularityEllipticQ
      kind: statement
      status: known
      note: The theorem of Breuil, Conrad, Diamond and Taylor, with equality of all the coefficients of the L-series.
    - name: Langlands.ModularitySemistableQ
      kind: statement
      status: known
    - name: Langlands.HasseWeilEllipticQ
      kind: statement
      status: known
    - name: Langlands.RamanujanPeterssonHolomorphic
      kind: statement
      status: known
    - name: Langlands.SatoTate
      kind: statement
      status: known
    - name: Langlands.EichlerShimuraDeligne
      kind: statement
      status: known
      note: The theorem of Eichler, Shimura and Deligne. A normalized eigenform of weight at least 2 has an l-adic Galois representation for each l and each isomorphism of the algebraic closure of Q_l with C.
    - name: Langlands.SerreModularityWeak
      kind: statement
      status: known
      note: The weak form of Serre's conjecture, the theorem of Khare and Wintenberger, with traces and determinants of Frobenius at almost all primes.
    - name: Langlands.TorusGeneral.LocalLanglandsTorus
      kind: statement
      status: known
      note: The local Langlands correspondence for a torus that splits over a finite Galois extension L, as a natural family of isomorphisms from the continuous characters of T(K) to H^1 of the Weil group with values in the dual torus. The family is compatible with the split case and with induced tori. This is the theorem of Langlands, with uniqueness by Yu.
    - name: Langlands.TorusGeneral.matPow
      kind: definition
      status: proved
      note: The map of tori that an integer matrix gives, with Langlands.TorusGeneral.matPow_one and Langlands.TorusGeneral.matPow_mul.
    - name: Langlands.TorusGeneral.torusPoints
      kind: definition
      status: proved
      note: The points T(K) of the torus with character lattice Z^n and a given Galois action, as a subgroup of (L^x)^n.
    - name: Langlands.SerreModularityTame
      kind: statement
      status: known
      note: The strong form of Serre's conjecture when the restriction to inertia at p is tame, with the Artin conductor away from p and the weight of Serre's recipe from sections 2.2 and 2.3 of his 1987 paper. This follows from the work of Khare and Wintenberger with the level and weight results.
    - name: Langlands.SerreModularity
      kind: statement
      status: known
      note: The strong form of Serre's conjecture for a weight rule that agrees with the tame recipe. The weight rule is a parameter, because the wild case of section 2.4 is not stated. Langlands.SerreModularity.tame gives the tame form.
    - name: Langlands.SerreModularityStrong
      kind: statement
      status: known
      note: The strong form of Serre's conjecture with the level N(rho) and the weight k(rho) of Serre's recipe, in the tame and the wild cases (Serre 1987, sections 2 and 3). This is the theorem of Khare and Wintenberger with the level and weight results.
    - name: Langlands.BreuilMezardGL2Qp
      kind: statement
      status: known
      note: A shape only. The deformation rings, the multiplicities and the inertial types are fields of a structure, because Mathlib does not have them. The shape is satisfiable for trivial reasons and does not count as the statement.
    - name: Langlands.BreuilMezardGL2QpFull
      kind: statement
      status: known
      note: 'The Breuil-Mezard conjecture for GL_2(Q_p) with real pieces. The left side is the Hilbert-Samuel multiplicity of the special fiber of the quotient of a universal framed deformation ring by the potentially semistable points with Hodge-Tate weights lambda and inertial type tau. The right side uses the Serre weight multiplicities typeMultiplicityOf for every E-model of a Henniart type sigma(tau). The inertial type of a lift is a parameter wd, because D_pst and the Weil-Deligne representation of Fontaine are not in the library. The statement is faithful when wd is WD(D_pst(rho)) on inertia. Kisin proved the conjecture for p > 2 in most cases.'
    - name: Langlands.ArtinConjecture
      kind: statement
      status: open
      note: Artin's conjecture. The L-function of a nontrivial irreducible complex representation of a finite Galois group is entire.
    - name: Langlands.ArtinOdd2Q
      kind: statement
      status: known
      note: Artin's conjecture for odd two-dimensional representations over Q, with the newform of weight one. The theorem of Khare and Wintenberger and of Kisin.
    - name: Langlands.LocalLanglandsGL
      kind: statement
      status: known
      note: The local Langlands correspondence for GL(n), the existence part, with the conditions of Henniart on GL(1), the central character, twists, the contragredient and the standard L-factors. The conditions on the epsilon factors and on the L-factors of pairs are not in the statement yet, so it does not determine the correspondence on the supercuspidal representations.
    - name: Langlands.LocalLanglandsGL2
      kind: statement
      status: known
      note: The local Langlands correspondence for GL(2), with the explicit parameters of the subrepresentations of the principal series and of the twists of the Steinberg representation. The epsilon factors are not in the statement yet.
    - name: Langlands.LocalLanglandsSL2
      kind: statement
      status: known
      note: The L-packets of SL(2) as the restrictions of the irreducible representations of GL(2), in the form of Labesse and Langlands. The parametrization of a packet by the component group is not in the statement.
    - name: Langlands.JacquetLanglandsGL2
      kind: statement
      status: known
      note: The local Jacquet-Langlands correspondence between the discrete series of GL(2) and the irreducible representations of the units of the quaternion division algebra, characterized by the character identity with the sign -1 on the regular elliptic elements.
    - name: Langlands.RamanujanGL
      kind: statement
      status: open
      note: The Ramanujan conjecture for GL(n) over a number field at the unramified places. Each Satake parameter of a bounded cusp form that is a Hecke eigenform has absolute value one.
    - name: Langlands.FunctorialityGL
      kind: statement
      status: open
      note: Langlands functoriality for an algebraic representation r of GL(n) into GL(m), at the unramified places. Each cusp form that is a Hecke eigenform has an isobaric lift whose Satake parameters are the eigenvalues of r at the Satake parameters of the form.
    - name: Langlands.SymPowerFunctoriality
      kind: statement
      status: known
      note: The symmetric power functoriality of Newton and Thorne. For a normalized eigenform of weight k at least 2 without complex multiplication, each symmetric power has a cuspidal lift to GL(n+1) over Q, at the unramified places.
    - name: Langlands.BaseChangeCyclic
      kind: statement
      status: known
      note: Cyclic base change of Arthur and Clozel for an extension of prime degree, at the unramified places.
    - name: Langlands.HasseWeil
      kind: statement
      status: open
      note: The Hasse-Weil zeta function of a proper model over the integers of a number field with a smooth generic fiber has a meromorphic continuation to the complex plane. The functional equation is not in the statement.
    - name: Langlands.FundamentalLemma
      kind: statement
      status: known
      note: The fundamental lemma of Laumon and Ngo for the Lie algebra of a unitary group and an endoscopic group U(n1) x U(n2), for a large residue characteristic.
    - name: Langlands.FontaineMazurGL2Q
      kind: statement
      status: known
      note: The theorem of Kisin on the conjecture of Fontaine and Mazur for GL(2) over Q, in the ordinary form. An odd irreducible representation that is ordinary at p, with the residual conditions of Kisin, comes from an eigenform.
    - name: Langlands.ReciprocityFunctionFieldGL
      kind: statement
      status: known
      note: The theorem of L. Lafforgue for GL(n) over a global function field. For each prime l that is not the characteristic, there is a bijection between the cuspidal automorphic classes and the irreducible l-adic Galois representations with a determinant of finite order, and it matches the Hecke eigenvalues with the Frobenius eigenvalues at almost all places.
    - name: Langlands.LocalLanglandsGSp4
      kind: statement
      status: known
      note: The theorem of Gan and Takeda. For a nonarchimedean local field of characteristic 0 there is a surjection with finite fibers from the irreducible smooth representations of GSp(4) to the L-parameters into GSp(4, C). It matches the central character with the similitude character, respects twists, sends the constituents of each principal series to the diagonal parameter, and gives each discrete packet the size of the component group with exactly one generic member. The factors of pairs that make the map unique are not stated.
    - name: Langlands.AutomorphicToGalois
      kind: statement
      status: known
      note: The theorem of Harris, Lan, Taylor and Thorne and of Scholze. For K totally real or CM, each regular algebraic cuspidal class of GL(n) over K has, for each prime l and each iota, a continuous l-adic representation that is unramified at almost all places and matches it at almost all places. The exact set of unramified places and the local-global compatibility are left out.
    - name: Langlands.GlobalJacquetLanglandsGL2
      kind: statement
      status: known
      note: The theorem of Eichler and of Jacquet and Langlands in a special form. For a definite quaternion algebra over Q that ramifies exactly at p and infinity, the Hecke eigensystems on the right ideal classes of a maximal order, other than the system q + 1, are the eigensystems of the normalized eigenforms in S_2(Gamma_0(p)) at the primes other than p.
    - name: Langlands.ReciprocityGL
      kind: statement
      status: open
      note: A weak form of the reciprocity conjecture of Clozel and Fontaine-Mazur. Each algebraic cuspidal class of GL(n) over a number field has an irreducible l-adic representation that matches it at almost all places, the map is injective, and each representation with finite image is in its image. The de Rham condition is not in Mathlib, so the full bijection with the geometric representations is not stated.
    - name: Langlands.SelbergEigenvalue
      kind: statement
      status: open
      note: Selberg's conjecture. Each nonzero eigenvalue of the hyperbolic Laplacian on a congruence quotient is at least 1/4.
    - name: Langlands.RamanujanMaass
      kind: statement
      status: open
      note: The Ramanujan conjecture at the finite primes for Maass cusp forms, with the unitary normalization of the Hecke operators.
    - name: Langlands.Bridge.finiteAbelianLocalReciprocity
      kind: theorem
      status: proved
      note: Finite abelian local reciprocity. The proof is the port of n-yamaguchi-0729/ClassFieldTheory in Langlands/Ported/NYLL.
    - name: Langlands.Bridge.kroneckerWeber
      kind: theorem
      status: proved
      note: The theorem of Kronecker and Weber, the statement KroneckerWeber. The proof is the port of n-yamaguchi-0729/ClassFieldTheory in Langlands/Ported/NYLL, with the move from an abstract embedding into a cyclotomic field to a subfield of the algebraic closure.
    - name: Langlands.Bridge.globalReciprocity
      kind: theorem
      status: proved
      note: Global reciprocity, the statement GlobalReciprocity. The Artin map is the geometric global norm residue map of the port of n-yamaguchi-0729/ClassFieldTheory in Langlands/Ported/NYLL, so a uniformizer goes to the geometric Frobenius as IsArtinMap asks.
    - name: Langlands.Bridge.globalExistence
      kind: theorem
      status: proved
      note: The global existence theorem GlobalExistence. The proof is the port of n-yamaguchi-0729/ClassFieldTheory in Langlands/Ported/NYLL, with the move of the class field from the separable closure to the algebraic closure.
    - name: Langlands.Tate.real_local_functional_equation
      kind: theorem
      status: proved
      note: The local functional equation of Tate's thesis at a real place, for the standard test functions x^a exp(-pi x^2), with the root number (-i)^a.
    - name: Langlands.Tate.complex_local_functional_equation
      kind: theorem
      status: proved
      note: The local functional equation of Tate's thesis at a complex place, for the standard test functions conj(z)^|n| exp(-2 pi |z|^2), with the root number (-i)^|n|.
    - name: Langlands.Tate.prod_archZeta
      kind: theorem
      status: proved
      note: The product over the infinite places of the local zeta integrals of the standard test functions is pi^r2 times the archimedean factor gammaFactor of the statement HeckeFunctionalEquation.
    - name: Langlands.Tate.NonArchimedean.zetaIntegral_eq_localFactor
      kind: theorem
      status: proved
      note: At a finite place where the Hecke character is unramified, the local zeta integral of the characteristic function of the integers is the local factor of the L-function, in the region of convergence.
    - name: Langlands.Tate.NonArchimedean.fourier_indicator_integers
      kind: theorem
      status: proved
      note: For an additive character of the completion with conductor exponent d, the Fourier transform of the characteristic function of the integers is the characteristic function of the ball of radius q^d. The measure gives the integers the volume 1.
    - name: SchwartzMap.tsum_add_zlattice_eq
      kind: theorem
      status: proved
      note: The Poisson summation formula for a Schwartz function on a full lattice in a finite dimensional real inner product space, with the covolume of the lattice and the dual lattice.
    - name: Langlands.Tate.tsum_zlattice_gaussian
      kind: theorem
      status: proved
      note: The theta transformation formula for a full lattice. The theta series of the lattice at t is the inverse of the covolume times t^(-n/2) times the theta series of the dual lattice at 1/t.
    - name: Langlands.Tate.NonArchimedean.localFunctionalEquation_unramified
      kind: theorem
      status: proved
      note: The local functional equation of Tate's thesis at a finite place for an unramified character and the characteristic function of the integers, with the epsilon factor chi(pi)^d q^(d(1/2 - s)) times the constant q^(d/2) of the measure that gives the integers the volume 1.
    - name: Langlands.Tate.NonArchimedean.localFunctionalEquation_ramified
      kind: theorem
      status: proved
      note: The local functional equation of Tate's thesis at a finite place for a ramified character and the test function of Tate, with the epsilon factor given by a Gauss sum.
    - name: Langlands.Tate.NonArchimedean.norm_gaussSum_sq
      kind: theorem
      status: proved
      note: The square of the absolute value of the Gauss sum of a character with conductor exponent a is q^(-a), for the measure that gives the integers the volume 1.
    - name: Langlands.Tate.covolume_globalLattice
      kind: theorem
      status: proved
      note: The covolume of the lattice of a fractional ideal a in the euclidean mixed space, scaled by c_w at each infinite place, is the product of the scalings times N(a) 2^(-r_2) times the square root of the absolute discriminant.
    - name: Langlands.Tate.dedekindTheta_dual
      kind: theorem
      status: proved
      note: The theta transformation formula for a fractional ideal of a number field. The theta function of a at t is the theta function of the dual ideal at 1/t, divided by N(a), the square root of the absolute discriminant and the product of the square roots of t_w to the local degree.
    - name: Langlands.Tate.integral_exp_mul_prod_eq_gammaK
      kind: theorem
      status: proved
      note: The Mellin transform of one term of the theta function of a number field over the product of the half lines is the Gamma factor of K times the absolute norm of the element to the power -s.
    - name: Langlands.Tate.completedEpsteinZeta_sub
      kind: theorem
      status: proved
      note: The functional equation of the Epstein zeta function of a full lattice L in a real inner product space of dimension n. The completed function at n - s is the inverse of the covolume of L times the completed function of the dual lattice at s.
    - name: Langlands.Tate.completedEpsteinZeta_eq
      kind: theorem
      status: proved
      note: For Re s > n, the completed Epstein zeta function of L is Gamma_R(s) times the sum of |l|^(-s) over the nonzero vectors l of L.
    - name: Langlands.Tate.differentiableAt_completedEpsteinZeta
      kind: theorem
      status: proved
      note: The completed Epstein zeta function of a lattice is holomorphic outside s = 0 and s = n.
    - name: Langlands.Tate.completedIdealZeta_sub
      kind: theorem
      status: proved
      note: The functional equation of the trace form zeta function of a nonzero fractional ideal a of a number field K of degree n. The completed function at n - s is the inverse of N(a) times the square root of |d_K|, times the completed function of the dual ideal (a d)^(-1) at s.
    - name: Langlands.Tate.completedIdealZeta_eq
      kind: theorem
      status: proved
      note: For Re s > n, the completed trace form zeta function of a is Gamma_R(s) times the sum over the nonzero elements alpha of a of the power -s/2 of the sum of n_w |alpha|_w^2 over the infinite places w.
    - name: Langlands.Tate.completedIdealZeta_residue
      kind: theorem
      status: proved
      note: The completed trace form zeta function of a has residue 2 divided by N(a) times the square root of |d_K| at s = n.
    - name: Langlands.Tate.classZeta_two_sub
      kind: theorem
      status: proved
      note: The functional equation of the class zeta function of an imaginary quadratic field K. The class zeta function is the sum over the ideal classes C of c(a_C)^s times the trace form zeta function of a fractional ideal a_C in C, with c(a)^2 = N(a) times the square root of |d_K|. It is invariant under s to 2 - s for s not 0 or 2.
    - name: Langlands.Tate.classTerm_toPrincipalIdeal_mul
      kind: theorem
      status: proved
      note: For an imaginary quadratic field, the term c(a)^s times the completed trace form zeta function of a does not change if a is replaced by x a for x in K^x, for s not 0 or 2. The proof compares the Dirichlet series for Re s > 2 and uses the identity theorem.
    - name: Langlands.Tate.classZeta_eq
      kind: theorem
      status: proved
      note: For an imaginary quadratic field and Re s > 2, the class zeta function is Gamma_R(s) times the sum over the classes C of c(a_C)^s times the sum over the nonzero alpha in a_C of (2 |N(alpha)|)^(-s/2).
    - name: Langlands.Tate.classZeta_two_mul
      kind: theorem
      status: proved
      note: For an imaginary quadratic field K and Re u > 1, the class zeta function at 2u is w/2 times |d_K|^(u/2) times Gamma_C(u) times the Dedekind zeta function of K, where w is the number of roots of unity in K. The proof counts the generators of J I with the unit group, which is finite for an imaginary quadratic field.
    - name: Langlands.Tate.completedQuadraticZeta_one_sub
      kind: theorem
      status: proved
      note: The functional equation of the completed Dedekind zeta function of an imaginary quadratic field under u to 1 - u, for u not 0 or 1. The completed function is the class zeta function at 2u.
    - name: Langlands.Tate.differentiableAt_completedQuadraticZeta
      kind: theorem
      status: proved
      note: The completed Dedekind zeta function of an imaginary quadratic field is holomorphic at each u not 0 or 1.
    - name: Langlands.Tate.dedekindTheta_unitScale_add_int
      kind: theorem
      status: proved
      note: The theta function of a fractional ideal at t(y, c), with t(y, c)_w = y exp(2 sum_i c_i log |e_i|_w) for the fundamental units e_i, is periodic in c for the lattice Z^r. The reason is that the theta function is invariant under the units.
    - name: Langlands.Tate.continuousAt_dedekindTheta
      kind: theorem
      status: proved
      note: The theta function of a fractional ideal in several variables is continuous at each t with t_w > 0 for all w.
    - name: Langlands.Tate.setIntegral_comp_neg_of_periodic
      kind: theorem
      status: proved
      note: For a function G on R^r that is periodic for Z^r, the integral of G(-c) over [0, 1)^r is the integral of G(c) over [0, 1)^r, because -[0, 1)^r is also a fundamental domain of Z^r.
    - name: Langlands.Tate.unitTheta_inv
      kind: theorem
      status: proved
      note: The transformation formula of the theta function averaged over the units, Theta_a(1/y) = (N(a) sqrt|d_K|)^(-1) sqrt(y)^n Theta_dual(y) for y > 0. This is the first step of the proof of Hecke of the functional equation of the Dedekind zeta function.
    - name: Langlands.Tate.isBigO_unitTheta_sub_one
      kind: theorem
      status: proved
      note: The function Theta_a - 1 is O(y^s) at infinity for each real s.
    - name: Langlands.Tate.unitThetaFEPair
      kind: def
      status: proved
      note: The pair (Theta_a, Theta_dual) as a WeakFEPair of Mathlib, with weight n/2, root number (N(a) sqrt|d_K|)^(-1) and constant terms 1.
    - name: Langlands.Tate.unitConst_mul_integral_expMapBasis
      kind: theorem
      status: proved
      note: The change of variables t = expMapBasis x in the integral of Gamma_K(s) |N(alpha)|^(-s), with the Jacobian 2^(-r_2) n R_K.
    - name: Langlands.Tate.integrable_thetaTerm_expMapBasis
      kind: theorem
      status: proved
      note: The theta term in the coordinates of expMapBasis, times exp(n s x_0 / 2), is integrable for Re s > 0.
    - name: Langlands.Tate.measurePreserving_unitCoord
      kind: theorem
      status: proved
      note: The split of R^(S_inf) into the coordinate at w_0 and the r coordinates of the units preserves the measure.
    - name: Langlands.Tate.expMapBasis_unitCoord_symm
      kind: theorem
      status: proved
      note: In the coordinates (log y, 2c) the map expMapBasis gives the point t(y, c) of the unit theta function.
    - name: Langlands.Tate.integral_unitScale
      kind: theorem
      status: proved
      note: The Mellin transform in y of the integral over c in R^r of one theta term is 2^(r_2 - r) (n R_K)^(-1) Gamma_K(2s/n) |N(alpha)|^(-2s/n).
    - name: Langlands.Tate.unitsEquiv
      kind: definition
      status: proved
      note: The bijection from mu_K x Z^r to the units of O_K given by Dirichlet's unit theorem.
    - name: Langlands.Tate.lintegral_unitCube_eq_tsum
      kind: theorem
      status: proved
      note: The unfolding of the unit theta function with values in [0, infinity]. The integral over [0, 1)^r of theta_a - 1 is w_K times the sum over the ideal classes in the orbit of a of the integrals over R^r of one theta term.
    - name: Langlands.Tate.hasSum_unitTheta_sub_one
      kind: theorem
      status: proved
      note: The unfolding of the unit theta function as a convergent series of real numbers.
    - name: Langlands.Tate.hasSum_Λ_unitThetaFEPair
      kind: theorem
      status: proved
      note: For Re s > n/2 the Mellin transform Lambda_a(s) of the unit theta function is a Dirichlet series over the integral ideals I with a I principal.
    - name: Langlands.Tate.mem_orbits_iff
      kind: theorem
      status: proved
      note: An integral ideal I has a I principal if and only if the class of I is the inverse of the class of a.
    - name: Langlands.Tate.abs_norm_orbitRep
      kind: theorem
      status: proved
      note: A generator alpha_I of a I has |N(alpha_I)| = N(a) N(I).
    - name: Langlands.Tate.hasSum_Λ_unitThetaFEPair_class
      kind: theorem
      status: proved
      note: For Re s > n/2 the Mellin transform Lambda_a(s) is w_K Gamma_K(s') N(a)^(-s') times the partial zeta function of the class of the inverse of a at s' = 2s/n, divided by 2^(r - r_2) n R_K.
    - name: Langlands.Tate.classXi_one_sub
      kind: theorem
      status: proved
      note: The functional equation psi_a(1 - u) = psi_(a dual)(u) of the function psi_a(u) = |d_K|^(u/2) N(a)^u Lambda_a(n u / 2).
    - name: Langlands.Tate.classXi_eq_of_mk_eq
      kind: theorem
      status: proved
      note: The function psi_a depends only on the ideal class of a, outside u = 0 and u = 1.
    - name: Langlands.Tate.dedekindXi_eq
      kind: theorem
      status: proved
      note: For Re u > 1 the completed Dedekind zeta function xi_K(u) is |d_K|^(u/2) Gamma_K(u) zeta_K(u), with dedekindZeta of Mathlib.
    - name: Langlands.Tate.differentiableAt_dedekindXi
      kind: theorem
      status: proved
      note: The completed Dedekind zeta function is holomorphic outside u = 0 and u = 1.
    - name: Langlands.Tate.dedekindXi_one_sub
      kind: theorem
      status: proved
      note: The functional equation xi_K(1 - u) = xi_K(u) of the Dedekind zeta function of each number field K.
    - name: Langlands.Tate.isArchimedeanParameter_one_iff
      kind: theorem
      status: proved
      note: The archimedean parameters (n, t) of the trivial Hecke character at each infinite place are n = 0 and t = 0.
    - name: Langlands.Tate.gammaFactor_zero
      kind: theorem
      status: proved
      note: The archimedean factor of the Hecke L-function for the parameters 0 is 2^(r_2) Gamma_K(s).
    - name: Langlands.Tate.localFactor_one
      kind: theorem
      status: proved
      note: The local factor of the trivial Hecke character at a finite place v is (1 - N(v)^(-s))^(-1).
    - name: Langlands.Tate.summable_absNorm_rpow
      kind: theorem
      status: proved
      note: The series of N(I)^(-sigma) over the nonzero ideals I of the ring of integers converges for sigma > 1.
    - name: Langlands.Tate.hasSum_supportedIn
      kind: theorem
      status: proved
      note: For a finite set S of primes, the sum of N(I)^(-s) over the ideals with prime factors in S is the product over S of (1 - N(p)^(-s))^(-1).
    - name: Langlands.Tate.hasProd_dedekindZeta
      kind: theorem
      status: proved
      note: The Euler product of the Dedekind zeta function. For Re s > 1, zeta_K(s) is the product over the primes p of (1 - N(p)^(-s))^(-1).
    - name: Langlands.Tate.finiteLFunction_one
      kind: theorem
      status: proved
      note: For Re s > 1, the finite L-function of the trivial Hecke character is the Dedekind zeta function.
    - name: Langlands.Tate.meromorphicOrderAt_dedekindXi_zero
      kind: theorem
      status: proved
      note: The completed Dedekind zeta function xi_K has a simple pole at u = 0.
    - name: Langlands.Tate.meromorphicOrderAt_dedekindXi_one
      kind: theorem
      status: proved
      note: The completed Dedekind zeta function xi_K has a simple pole at u = 1.
    - name: Langlands.Tate.heckeLambdaOne_eq_discr_cpow_mul
      kind: theorem
      status: proved
      note: The completed L-function of the trivial Hecke character satisfies Lambda(s) = |d_K|^(1/2 - s) Lambda'(1 - s).
    - name: Langlands.Tate.heckeFunctionalEquationAt_one
      kind: theorem
      status: proved
      note: The conclusion of HeckeFunctionalEquationAt K for the trivial Hecke character, with sigma = 0, W = 1 and s_0 = 0. The general case is Langlands.heckeFunctionalEquation.
    - name: Langlands.Tate.isArchimedeanParameter_of_normPower
      kind: theorem
      status: proved
      note: The archimedean parameters of the Hecke character x -> |x|^s_0 are n = 0 and t = s_0.
    - name: Langlands.Tate.conductor_of_normPower
      kind: theorem
      status: proved
      note: The conductor of the Hecke character x -> |x|^s_0 is the unit ideal.
    - name: Langlands.Tate.completedLFunction_of_normPower
      kind: theorem
      status: proved
      note: The completed L-function of x -> |x|^s_0 is Lambda_K(s + s_0) for Re(s + s_0) > 1.
    - name: Langlands.Tate.heckeFunctionalEquationAt_normPower
      kind: theorem
      status: proved
      note: The conclusion of HeckeFunctionalEquationAt K for the Hecke characters x -> |x|^s_0, with sigma = Re s_0 and W = |d_K|^(sigma - s_0). This is the full polar case. The general case is Langlands.heckeFunctionalEquation.
    - name: Langlands.Tate.classCharXi_eq
      kind: theorem
      status: proved
      note: For a class group character psi and Re u > 1, xi(u, psi) = |d_K|^(u/2) Gamma_K(u) L(u, psi), with L(u, psi) the sum of psi([I]) N(I)^(-u).
    - name: Langlands.Tate.classCharXi_one_sub
      kind: theorem
      status: proved
      note: The functional equation xi(1 - u, psi) = psi([d]) xi(u, psi^-1) for u not 0 or 1, with d the different.
    - name: Langlands.Tate.sum_classChar_inv
      kind: theorem
      status: proved
      note: For a class group character psi other than 1, the sum of psi(C^-1) over the class group is 0.
    - name: Langlands.Tate.differentiable_classCharLambda
      kind: theorem
      status: proved
      note: The function E + dslope F_0 0 + dslope F_1 1 of a class group character is entire.
    - name: Langlands.Tate.classCharLambda_eq
      kind: theorem
      status: proved
      note: For psi other than 1, the entire function classCharLambda psi is equal to xi(u, psi) for u not 0 or 1.
    - name: Langlands.Tate.classCharLambda_one_sub
      kind: theorem
      status: proved
      note: 'Hecke''s theorem for class group characters: for psi other than 1, the entire continuation of xi(u, psi) satisfies the functional equation at all u. This covers the Hecke characters that are unramified everywhere and trivial at infinity. The link from HeckeCharacter is open.'
    - name: Langlands.Tate.IsClassType.apply_eq_classChar
      kind: theorem
      status: proved
      note: A Hecke character of class group type, unramified at each finite place and trivial at each infinite place, is chi(x) = psi([I(x)]) for a character psi of the class group.
    - name: Langlands.Tate.IsClassType.conductor_eq_one
      kind: theorem
      status: proved
      note: A Hecke character of class group type has conductor (1).
    - name: Langlands.Tate.IsClassType.isArchimedeanParameter
      kind: theorem
      status: proved
      note: A Hecke character of class group type has the archimedean parameters n = 0 and t = 0.
    - name: Langlands.Tate.hasProd_classCharL
      kind: theorem
      status: proved
      note: The Euler product of the L-function of a class group character for Re s > 1.
    - name: Langlands.Tate.IsClassType.completedLFunction_eq
      kind: theorem
      status: proved
      note: For a Hecke character of class group type, Lambda(s, chi) = 2^(r_2) Gamma_K(s) L(s, psi) for Re s > 1.
    - name: Langlands.Tate.IsClassType.heckeFunctionalEquation
      kind: theorem
      status: proved
      note: Hecke's theorem for each Hecke character of class group type. The conclusion of HeckeFunctionalEquationAt K holds. For psi = 1 the proof uses heckeFunctionalEquationAt_one, and for psi other than 1 it uses classCharLambda_one_sub.
    - name: Langlands.Groups.RootDatum.dual_dual
      kind: theorem
      status: proved
      note: The dual of the dual of a root datum is the root datum itself. The dual is the flip of Mathlib.
    - name: Langlands.Groups.RootDatum.dual_gl
      kind: theorem
      status: proved
      note: The root datum of GL_n is equal to its dual, so the dual group of GL_n is GL_n.
    - name: Langlands.Groups.RootDatum.dual_sl2
      kind: theorem
      status: proved
      note: The dual of the root datum of SL_2 is the root datum of PGL_2.
    - name: Langlands.Groups.RootDatum.torusDualEquiv
      kind: definition
      status: proved
      note: The dual of the root datum of a split torus with character lattice X is the root datum of the torus with character lattice the dual of X.
    - name: Langlands.Groups.QuasiSplitDatum.dual_dual
      kind: theorem
      status: proved
      note: 'The combinatorial L-group datum: the dual of a based root datum with an action of a group that keeps the base, and the dual of the dual is the original datum.'
    - name: Langlands.Groups.QuasiSplitDatum.dual_split_sl2
      kind: theorem
      status: proved
      note: The L-group datum of split SL_2 is the split datum of PGL_2.
    - name: Langlands.Tate.heckeFunctionalEquation_of_twist
      kind: theorem
      status: proved
      note: 'The shift of the theorem of Hecke: if it holds for chi, then it holds for the twist chi |.|^s_0, with sigma + Re s_0, Lambda(s + s_0) and the root number times D^(Re s_0 - s_0).'
    - name: Langlands.Tate.IsClassType.heckeFunctionalEquation_twist
      kind: theorem
      status: proved
      note: Hecke's theorem for chi |.|^s_0 with chi of class group type and s_0 any complex number.
    - name: Langlands.Tate.continuous_ideleNorm
      kind: theorem
      status: proved
      note: The idele norm of a number field is continuous.
    - name: Langlands.Tate.exists_isClassType_twist_iff
      kind: theorem
      status: proved
      note: A Hecke character is unramified at each finite place with infinite components |.|_w^s_0 if and only if it is chi |.|^s_0 with chi of class group type.
    - name: Langlands.Tate.heckeFunctionalEquation_of_unramified
      kind: theorem
      status: proved
      note: Hecke's theorem for each Hecke character that is unramified at each finite place and has infinite components |.|_w^s_0 for one s_0.
    - name: Langlands.isGreatest_smoothVectors
      kind: theorem
      status: proved
      note: The smooth vectors of a representation form the largest stable subspace on which the representation is smooth.
    - name: Langlands.SmoothRep.IsAdmissible.sub
      kind: theorem
      status: proved
      note: A subrepresentation of an admissible smooth representation is admissible.
    - name: Langlands.SmoothRep.ind
      kind: definition
      status: proved
      note: 'Smooth induction from a subgroup H to G: the functions with f(hg) = sigma(h) f(g) that are right invariant under an open subgroup.'
    - name: Langlands.SmoothRep.frobenius
      kind: definition
      status: proved
      note: Frobenius reciprocity for smooth induction, as a linear equivalence Hom_G(pi, Ind sigma) = Hom_H(pi restricted to H, sigma).
    - name: Langlands.SmoothRep.jacquet
      kind: definition
      status: proved
      note: The Jacquet module V_N = V / V(N) as a smooth representation of a group M that normalizes N.
    - name: Langlands.SmoothRep.jacquetEquiv
      kind: definition
      status: proved
      note: 'The universal property of the Jacquet module: Hom_M(V_N, tau) is the space of M-maps from V to tau that are invariant under N.'
    - name: Langlands.principalSeriesInd
      kind: definition
      status: proved
      note: The principal series of GL_2(K) induced from the character (chi_1, chi_2) of the Borel subgroup, not normalized.
    - name: Langlands.Tate.NonArchimedean.gaussSum_eq_gaussSumFinite
      kind: theorem
      status: proved
      note: The Gauss sum integral over the units is q^(-a) times the finite Gauss sum.
    - name: Langlands.Tate.NonArchimedean.norm_gaussSumFinite_sq
      kind: theorem
      status: proved
      note: The finite Gauss sum of a character of conductor exponent a has squared absolute value q^a.
    - name: Langlands.Tate.NonArchimedean.sum_charExt_rep_eq_zero
      kind: theorem
      status: proved
      note: A ramified character has sum 0 over the units of the residue ring.
    - name: Langlands.Tate.NonArchimedean.zetaIntegral_eq_zero_of_ramified
      kind: theorem
      status: proved
      note: For a ramified character the zeta integral of a unit invariant function is 0.
    - name: Langlands.Tate.NonArchimedean.exists_isTrivialOnHigherUnits
      kind: theorem
      status: proved
      note: Every Hecke character has a finite conductor exponent at each finite place.
    - name: Langlands.Tate.NonArchimedean.localFactor_eq_one_of_not_isUnramifiedAt
      kind: theorem
      status: proved
      note: The local factor of a Hecke character at a ramified place is 1.
    - name: Langlands.Tate.NonArchimedean.norm_gaussSumFinite_finiteComponent_sq
      kind: theorem
      status: proved
      note: The Gauss sum of a Hecke character at a ramified place has squared absolute value q^a.
    - name: Langlands.Tate.NonArchimedean.epsilonRamified_eq_cpow
      kind: theorem
      status: proved
      note: The local epsilon factor at a ramified place in terms of the finite Gauss sum.
    - name: Langlands.Tate.NonArchimedean.gaussSumFinite
      kind: definition
      status: proved
      note: The finite Gauss sum over the units of the residue ring.
    - name: Langlands.GL2.modulus
      kind: definition
      status: proved
      note: The modulus character delta_B(b) = |b_00 / b_11| of the Borel subgroup of GL_2(K).
    - name: Langlands.normPrincipalSeries
      kind: definition
      status: proved
      note: The normalized principal series of GL_2(K), induced from (chi_1, chi_2) times delta_B^(1/2).
    - name: Langlands.normPrincipalSeries_iso
      kind: theorem
      status: proved
      note: The normalized principal series is isomorphic to principalSeries of the statements.
    - name: Langlands.GL2.iwasawa
      kind: theorem
      status: proved
      note: The Iwasawa decomposition GL_2(K) = B(K) GL_2(O_K).
    - name: Langlands.SmoothRep.ind_isAdmissible
      kind: theorem
      status: proved
      note: Induction of a finite dimensional representation from a cocompact subgroup is admissible.
    - name: Langlands.principalSeries_isAdmissible
      kind: theorem
      status: proved
      note: The principal series of GL_2(K) is admissible.
    - name: Langlands.principalSeriesJacquetEval_surjective
      kind: theorem
      status: proved
      note: Evaluation at 1 gives a surjection from the Jacquet module of the principal series onto chi_1 tensor chi_2.
    - name: Langlands.SmoothRep.jacquetMap_exact
      kind: theorem
      status: proved
      note: The Jacquet functor is right exact.
    - name: Langlands.LocalGL1.exists_iso_charRep
      kind: theorem
      status: proved
      note: 'Schur''s lemma: an irreducible admissible smooth representation of a commutative group is a character.'
    - name: Langlands.LocalGL1.rec1
      kind: definition
      status: proved
      note: The bijection from irreducible smooth representations of GL_1(K) to one dimensional Weil-Deligne representations through the local Artin map.
    - name: Langlands.LocalGL1.isLanglandsMap_rec0
      kind: theorem
      status: proved
      note: The m = 0 case of the local Langlands conditions.
    - name: Langlands.LocalGL1.isLanglandsFamily_recFamily
      kind: theorem
      status: proved
      note: The family rec_0, rec_1 satisfies IsLanglandsFamily for n = 1, given the GL_1 L-factor condition.
    - name: Langlands.LocalGL1.GL1LFactor
      kind: definition
      status: proved
      note: 'The L-factor condition for GL_1: Tate''s local theory in Godement-Jacquet form. It is not proved yet.'
    - name: Langlands.LocalGL1.localLanglandsGL_one_of_gl1LFactor
      kind: theorem
      status: proved
      note: GL1LFactor implies LocalLanglandsGL 1.
    - name: Langlands.Tate.IsRayClassType
      kind: definition
      status: proved
      note: A Hecke character that is trivial at every infinite place and may be ramified at finitely many finite places.
    - name: Langlands.Tate.conductor_eq_prod
      kind: theorem
      status: proved
      note: The conductor of a Hecke character is the product of p_v^(a_v) over the ramified places.
    - name: Langlands.Tate.finite_setOf_not_isUnramifiedAt
      kind: theorem
      status: proved
      note: A Hecke character is ramified at only finitely many finite places.
    - name: Langlands.Tate.IsRayClassType.idealChar_toPrincipalIdeal
      kind: theorem
      status: proved
      note: A character of ray class type is trivial on the principal ideals of elements that are 1 modulo the conductor.
    - name: Langlands.Tate.IsRayClassType.finiteLFunction_eq
      kind: theorem
      status: proved
      note: For Re s > 1 the finite L-function of a character of ray class type is its Dirichlet series over the ideals prime to the conductor.
    - name: Langlands.GL2.bruhat
      kind: theorem
      status: proved
      note: The Bruhat decomposition GL_2(K) = B and B w N over any field.
    - name: Langlands.GL2.bigCell_unique
      kind: theorem
      status: proved
      note: The decomposition b w n of an element of the big cell is unique.
    - name: Langlands.SmoothRep.mem_jacquetKer_iff
      kind: theorem
      status: proved
      note: 'Jacquet''s lemma: v lies in V(N) if and only if its average over some compact open subgroup of N is 0.'
    - name: Langlands.SmoothRep.jacquetMap_injective
      kind: theorem
      status: proved
      note: The Jacquet functor preserves injections when N is a union of compact open subgroups.
    - name: Langlands.SmoothRep.jacquetMap_shortExact
      kind: theorem
      status: proved
      note: The Jacquet functor is exact when N is a union of compact open subgroups.
    - name: Langlands.SmoothRep.jacquetMap_unipotent_shortExact
      kind: theorem
      status: proved
      note: The Jacquet functor for the unipotent radical of the Borel subgroup of GL_2(K) is exact.
    - name: Langlands.Tate.completedShiftEpsteinZeta_sub
      kind: theorem
      status: proved
      note: The functional equation of the completed shifted Epstein zeta function.
    - name: Langlands.Tate.shiftTheta_eq
      kind: theorem
      status: proved
      note: Poisson summation for the shifted and twisted theta function.
    - name: Langlands.Tate.differentiable_completedShiftEpsteinZeta
      kind: theorem
      status: proved
      note: The completed shifted Epstein zeta function is entire when x is not in M and y is not in the dual lattice.
    - name: Langlands.Tate.IsRayClassType.idealChar_toPrincipalIdeal_eq
      kind: theorem
      status: proved
      note: A ray class character on principal ideals is periodic modulo the conductor.
    - name: Langlands.LocalGL1.localLanglandsGL_one
      kind: theorem
      status: proved
      note: 'LocalLanglandsGL 1 with no hypothesis: the local Langlands correspondence for GL(1), with the standard L-factors matched by Tate''s local computation.'
    - name: Langlands.LocalGL1.gl1LFactorNontrivial
      kind: theorem
      status: proved
      note: The L-factor of a nonzero smooth character representation of GL(1) is the Godement-Jacquet L-factor of the character.
    - name: Langlands.LocalGL1.not_gl1LFactor
      kind: theorem
      status: proved
      note: GL1LFactor as stated in GL1.lean is false, because the zero representation has only zero zeta integrals. GL1LFactorNontrivial is the corrected form.
    - name: Langlands.LocalGL1.exists_zeta_eq
      kind: theorem
      status: proved
      note: Tate's local computation of the zeta integral of a Schwartz-Bruhat function on a nonarchimedean local field.
    - name: Langlands.LocalGL1.unramified_iff
      kind: theorem
      status: proved
      note: A character of the multiplicative group is unramified if and only if the Weil group character is trivial on inertia.
    - name: Langlands.LocalGL1.distribHaarChar_eq
      kind: theorem
      status: proved
      note: The Haar modulus of a unit a is q to the power minus ord a.
    - name: Langlands.finrank_principalSeriesJacquet
      kind: theorem
      status: proved
      note: The Jacquet module of the principal series of GL2 with respect to N has dimension 2.
    - name: Langlands.principalSeriesJacquet_shortExact
      kind: theorem
      status: proved
      note: The exact sequence 0 to (V_w)_N to V_N to the character chi to 0 of torus representations, with (V_w)_N isomorphic to the twisted Weyl conjugate of chi.
    - name: Langlands.bigCellJacquet_iso
      kind: theorem
      status: proved
      note: The Jacquet module of the big cell part of the principal series is the character diag(a,d) to chi2(a)|a| chi1(d)|d|^-1.
    - name: Langlands.principalSeriesBigCell_shortExact
      kind: theorem
      status: proved
      note: The big cell part of the principal series is the kernel of evaluation at 1, and evaluation at 1 is surjective.
    - name: Langlands.Tate.IsRayClassType.hasSum_partialLSeries
      kind: theorem
      status: proved
      note: The partial L-series of a ray class character of an imaginary quadratic field over one ideal class is a finite combination of shifted Epstein zeta functions of the lattice fJ.
    - name: Langlands.Tate.rayClassCompleted_two_sub
      kind: theorem
      status: proved
      note: The functional equation of the completed partial L-series, with the dual side over the dual lattice of fJ.
    - name: Langlands.Tate.hasSum_rayClass_dual
      kind: theorem
      status: proved
      note: The dual side of the partial L-series as a Dirichlet series over the trace dual of fJ, weighted by finite Gauss sums.
    - name: Langlands.Tate.gammaℝ_mul_finiteLFunction
      kind: theorem
      status: proved
      note: The completed finite L-function of a ray class character of an imaginary quadratic field is the sum of the completed partial L-series over the ideal classes.
    - name: Langlands.Tate.IsRayClassType.differentiable_rayClassCompleted
      kind: theorem
      status: proved
      note: The completed partial L-series is entire when the residue coefficients sum to zero.
    - name: Langlands.Tate.covolume_rayLattice
      kind: theorem
      status: proved
      note: The covolume of the lattice fJ is N(f) N(J) times the square root of the absolute discriminant.
    - name: Langlands.LocalGL1.localFunctionalEquation_unramified
      kind: theorem
      status: proved
      note: Tate's local functional equation for an unramified character and the test function 1_O, with the epsilon factor c q^{-ns}.
    - name: Langlands.LocalGL1.localFunctionalEquation_ramified
      kind: theorem
      status: proved
      note: Tate's local functional equation for a ramified character of conductor exponent a and the test function 1_{1+p^a}, with epsilon factor G(chi, psi) q^{-(a+n)s}. The proof that G is not zero is open.
    - name: Langlands.LocalGL1.epsilonUnramified_eq
      kind: theorem
      status: proved
      note: The unramified epsilon factor is c q^{-ns} with c not zero.
    - name: Langlands.LocalGL1.existsUnique_selfDual
      kind: theorem
      status: proved
      note: Exactly one scaling of the Haar measure is self-dual for psi on the translated balls.
    - name: Langlands.LocalGL1.fourier_fourier_ballIndicator
      kind: theorem
      status: proved
      note: The double Fourier transform of the indicator of a translated ball.
    - name: Langlands.SmoothRep.jacquetFrobenius
      kind: definition
      status: proved
      note: 'Frobenius reciprocity for the principal series: Hom_G(pi, Ind_B^G alpha) is equivalent to Hom_T(pi_N, alpha).'
    - name: Langlands.principalSeriesInd_sub_jacquet_nontrivial
      kind: theorem
      status: proved
      note: A nonzero G-stable subspace W of the principal series has a nonzero Jacquet module W_N.
    - name: Langlands.principalSeriesInd_hom_eq
      kind: theorem
      status: proved
      note: A nonzero G-map between principal series Ind(chi) to Ind(alpha) exists only if alpha is chi or its twisted Weyl conjugate.
    - name: Langlands.normPrincipalSeries_hom_eq
      kind: theorem
      status: proved
      note: A nonzero G-map between normalized principal series exists only if the pair of characters is the same or swapped.
    - name: Langlands.normPrincipalSeries_exists_hom_of_quotient
      kind: theorem
      status: proved
      note: If W is a nonzero subrepresentation of the normalized principal series whose quotient has nonzero Jacquet module, there is a nonzero G-map normPS(chi1,chi2) to normPS(chi2,chi1) that kills W.
    - name: Langlands.Tate.IsRayClassType.sum_rayLatticeCoeff_eq_zero
      kind: theorem
      status: proved
      note: The coefficient sum of a nontrivial ray class character over the lattice classes is zero.
    - name: Langlands.Tate.IsRayClassType.differentiable_rayClassCompleted_of_nonempty
      kind: theorem
      status: proved
